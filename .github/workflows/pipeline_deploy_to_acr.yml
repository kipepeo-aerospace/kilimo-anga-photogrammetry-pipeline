name: Build and Push to ACR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login kilimoangaacr2025.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t kilimoangaacr2025.azurecr.io/kilimo-anga-photogrammetry-pipeline:latest .

      - name: Push Docker image
        run: |
          docker push kilimoangaacr2025.azurecr.io/kilimo-anga-photogrammetry-pipeline:latest